<script>
/* One app (owner, 12 Nov 2026: "the links of each book no longer work, even the installed apps; everything works with the big app link").
   1) Inside Student Master Review: a book frame opened with #smr-move=… takes the student's device identity from the book they used on its
      own (device id, activation, trial, name, language), so the subscription and the synced notes follow with no new code and no extra device.
   2) Opened on its own address (old link or installed book app): a short notice; the end of the page saves what is not yet online and moves
      the student into the platform. */
(function(){var PX='prr';
  try{var m=location.hash.match(/smr-move=([A-Za-z0-9+\/=%_-]+)/);if(m){var o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    var mine=localStorage.getItem(PX+'-k')||localStorage.getItem(PX+'-act')||localStorage.getItem(PX+'-code');
    if(!mine)Object.keys(o).forEach(function(k){if(k.indexOf(PX+'-')===0&&typeof o[k]==='string')localStorage.setItem(k,o[k])});
    history.replaceState(null,'',location.pathname+location.search+(o.__code?'#code='+o.__code:''))}}catch(e){}
  var top=true;try{top=window.top===window.self}catch(e){top=false}
  if(top&&/^(obstetrics-master-review\.pages\.dev|surgery-master-review\.jaberarja555\.workers\.dev|pediatrics-master-review\.jaberarja555\.workers\.dev)$/.test(location.hostname)){window.__smrMove=1;var en=false;try{en=localStorage.getItem(PX+'-lang')==='en'}catch(e){}
    document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='smrMove';d.setAttribute('role','status');
      d.innerHTML='<div><img src="https://student-master-review.pages.dev/icon-192.png" alt=""><b>'+(en?'This book now opens inside Student Master Review':'الكتاب الآن داخل تطبيق Student Master Review')+'</b><span>'+(en?'Saving your notes and moving you…':'جارٍ حفظ ملاحظاتك والانتقال…')+'</span><i></i></div>';
      var s=document.createElement('style');s.textContent='#smrMove{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#f7f3ec;font:600 15px/1.5 system-ui,-apple-system,"Segoe UI",Cairo,sans-serif;color:#142a4c;text-align:center;padding:24px}#smrMove div{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px}#smrMove img{width:84px;height:84px;border-radius:22px}#smrMove b{font-size:18px}#smrMove span{color:#55617a}#smrMove i{width:28px;height:28px;border-radius:50%;border:3px solid #11807a33;border-top-color:#11807a;animation:smrsp 0.9s linear infinite}@keyframes smrsp{to{transform:rotate(360deg)}}';
      document.head.appendChild(s);document.body.appendChild(d)})}})();
</script><script>
/* A new version of the book replaces the saved copy at once when the app has just been opened (owner, 12 Nov 2026: changes must show),
   instead of only at the next opening: when the new saved copy is ready in the first 90 s (or while the app is in the background), reload once. */
(function(){if(!('serviceWorker' in navigator))return;var had=!!navigator.serviceWorker.controller,t0=Date.now(),done=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(done||!had)return;if(Date.now()-t0<90000||document.hidden){done=true;location.reload()}})})();
</script>
